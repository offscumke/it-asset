<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>资产详情</title>
<style>
:root{
  --bg:#090e13;--surface:#111820;--surface-2:#16212b;--border:#263543;--text:#edf4f8;
  --muted:#93a4b1;--subtle:#667886;--teal:#2dd4bf;--blue:#60a5fa;--amber:#fbbf24;
  --violet:#a78bfa;--orange:#fb923c;--green:#34d399;--red:#fb7185
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:24px 14px;letter-spacing:0}
.page{width:min(100%,560px);margin:0 auto}
.header{padding:16px 4px 20px;border-bottom:1px solid var(--border);margin-bottom:18px}
.header-row{display:flex;align-items:flex-start;gap:12px}
.type-icon{width:44px;height:44px;display:grid;place-items:center;background:#102a46;border:1px solid #23578b;color:var(--blue);border-radius:8px;font-size:12px;font-weight:800;flex:0 0 auto}
.type-icon.switch,.type-icon.router,.type-icon.wireless_ap{background:#0c302d;border-color:#17675d;color:var(--teal)}
.type-icon.firewall{background:#37161d;border-color:#722635;color:var(--red)}
.type-icon.server,.type-icon.storage{background:#2b2045;border-color:#58418d;color:var(--violet)}
.type-icon.printer{background:#35280c;border-color:#70530c;color:var(--amber)}
.type-icon.other{background:var(--surface-2);border-color:var(--border);color:var(--muted)}
h1{font-size:21px;line-height:1.3;word-break:break-word}
.sub{font-size:12px;color:var(--muted);margin-top:5px}
.status{display:inline-flex;align-items:center;padding:4px 10px;border-radius:20px;font-size:12px;margin-top:12px;border:1px solid}
.status.online{background:#0c2d22;color:var(--green);border-color:#176047}
.status.offline{background:#37161d;color:var(--red);border-color:#722635}
.status.unknown{background:var(--surface-2);color:var(--muted);border-color:var(--border)}
.section{border-bottom:1px solid var(--border);padding:0 4px 14px;margin-bottom:14px}
.section h2{font-size:11px;color:var(--teal);text-transform:uppercase;margin-bottom:6px;font-weight:800}
.section.owner h2{color:var(--amber)}.section.state h2{color:var(--green)}
.row{display:grid;grid-template-columns:minmax(90px,34%) 1fr;gap:14px;padding:11px 0;border-bottom:1px solid #1b2833}
.row:last-child{border-bottom:0}
.key{color:var(--muted);font-size:13px}
.value{font-size:14px;text-align:right;word-break:break-word}
.loading,.error{text-align:center;color:var(--muted);padding:80px 20px}.error{color:var(--red)}
.back{display:block;width:100%;height:44px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-size:14px;cursor:pointer}
.back:hover{border-color:var(--teal);color:var(--teal)}
.back:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
@media(max-width:360px){.row{grid-template-columns:1fr;gap:5px}.value{text-align:left}}
</style>
</head>
<body>
<main class="page">
  <div id="loading" class="loading">正在读取资产信息...</div>
  <div id="content" hidden></div>
  <div id="error" class="error" hidden></div>
</main>
<script>
const ASSET_TYPES = {
  computer:['电脑','PC'], server:['服务器','SR'], switch:['交换机','SW'],
  firewall:['防火墙','FW'], router:['路由器','RT'], wireless_ap:['无线 AP','AP'],
  printer:['打印机','PR'], storage:['存储','ST'], other:['其他','OT']
};
const LIFECYCLE_TYPES = {
  in_use:'在用', spare:'备用', repair:'维修', loaned:'借出', retired:'已报废', lost:'丢失'
};
const assetId=new URLSearchParams(location.search).get('id')||'';
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtDate(value){
  if(!value)return '—';
  const date=new Date(/[zZ]|[+-]\d\d:?\d\d$/.test(value)?value:value+'Z');
  return Number.isNaN(date.getTime())?'—':date.toLocaleString('zh-CN');
}
function row(label,value){return `<div class="row"><span class="key">${label}</span><span class="value">${value||'—'}</span></div>`;}
function render(asset){
  const [typeLabel,typeIcon]=ASSET_TYPES[asset.asset_type]||ASSET_TYPES.other;
  const status=asset.online_status||'unknown';
  const statusLabel=status==='online'?'● 在线':status==='offline'?'○ 离线':'— 未检测';
  const checkedAt=asset.source==='manual'?asset.last_ping_at:asset.last_seen;
  const lifecycle=LIFECYCLE_TYPES[asset.lifecycle_status||'in_use']||'在用';
  document.title=asset.hostname+' · 资产详情';
  document.getElementById('content').innerHTML=`
    <header class="header">
      <div class="header-row"><div class="type-icon ${esc(asset.asset_type)}">${typeIcon}</div><div>
        <h1>${esc(asset.hostname)}</h1>
        <div class="sub">${typeLabel} · ${asset.source==='agent'?'Agent 自动采集':'手工录入'}</div>
      </div></div>
      <span class="status ${status}">${statusLabel}</span>
    </header>
    <section class="section"><h2>资产信息</h2>
      ${row('厂商 / 型号',(esc(asset.manufacturer)||'—')+' / '+(esc(asset.model)||'—'))}
      ${row('序列号',esc(asset.serial_number))}
      ${row('资产标签',esc(asset.asset_tag))}
      ${row('IP 地址',esc(asset.ip))}
      ${row('MAC 地址',esc(asset.mac_address))}
    </section>
    <section class="section owner"><h2>归属信息</h2>
      ${row('部门',esc(asset.department))}
      ${row('责任人',esc(asset.owner))}
      ${row('位置',esc(asset.location))}
      ${asset.notes?row('备注',esc(asset.notes)):''}
    </section>
    <section class="section state"><h2>状态</h2>
      ${row('生命周期状态',lifecycle)}
      ${row(asset.source==='manual'?'最后 Ping':'最后上报',fmtDate(checkedAt))}
      ${asset.ping_latency_ms!=null?row('Ping 延迟',esc(asset.ping_latency_ms)+' ms'):''}
    </section>
    <button class="back" onclick="history.length>1?history.back():location.href='/'">返回</button>`;
  document.getElementById('loading').hidden=true;
  document.getElementById('content').hidden=false;
}
async function loadAsset(){
  if(!assetId)throw new Error('二维码中缺少资产 ID');
  const response=await fetch(`/api/public/assets/${encodeURIComponent(assetId)}`,{cache:'no-store'});
  const data=await response.json().catch(()=>({}));
  if(!response.ok)throw new Error(data.error==='not found'?'资产不存在':data.error||'无法获取资产信息');
  render(data);
}
loadAsset().catch(error=>{
  document.getElementById('loading').hidden=true;
  const target=document.getElementById('error');
  target.hidden=false;
  target.textContent=error.message;
});
</script>
</body>
</html>
