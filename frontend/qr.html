<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>资产详情</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f1117;color:#e2e8f0;min-height:100vh;padding:20px 14px}
.page{width:min(100%,560px);margin:0 auto}
.header{padding:12px 4px 18px;border-bottom:1px solid #2d3348;margin-bottom:18px}
.header-row{display:flex;align-items:flex-start;gap:12px}
.type-icon{width:42px;height:42px;display:grid;place-items:center;background:#252839;border:1px solid #3a4058;border-radius:8px;font-size:22px;flex:0 0 auto}
h1{font-size:21px;line-height:1.3;word-break:break-word}
.sub{font-size:12px;color:#64748b;margin-top:5px}
.status{display:inline-flex;align-items:center;padding:4px 10px;border-radius:20px;font-size:12px;margin-top:12px;border:1px solid}
.status.online{background:#0f2a1a;color:#34d399;border-color:#065f46}
.status.offline{background:#1f1515;color:#f87171;border-color:#7f1d1d}
.status.unknown{background:#252839;color:#94a3b8;border-color:#3a4058}
.section{border-bottom:1px solid #2d3348;padding:0 4px 14px;margin-bottom:14px}
.section h2{font-size:12px;color:#7c85f3;text-transform:uppercase;margin-bottom:6px}
.row{display:grid;grid-template-columns:minmax(90px,34%) 1fr;gap:14px;padding:10px 0;border-bottom:1px solid #1e2235}
.row:last-child{border-bottom:0}
.key{color:#94a3b8;font-size:13px}
.value{font-size:14px;text-align:right;word-break:break-word}
.loading,.error{text-align:center;color:#64748b;padding:80px 20px}
.error{color:#f87171}
.back{display:block;width:100%;border:1px solid #2d3348;border-radius:8px;padding:12px;background:#1a1d2e;color:#e2e8f0;font-size:14px;cursor:pointer}
@media(max-width:360px){.row{grid-template-columns:1fr;gap:5px}.value{text-align:left}}
</style>
</head>
<body>
<main class="page">
  <div id="loading" class="loading">正在读取资产信息...</div>
  <div id="content" hidden></div>
  <div id="error" class="error" hidden></div>
</main>
<script>
const ASSET_TYPES = {
  computer:['电脑','💻'], server:['服务器','▣'], switch:['交换机','⇄'],
  firewall:['防火墙','◆'], router:['路由器','⇆'], wireless_ap:['无线 AP','⌁'],
  printer:['打印机','▤'], storage:['存储','▥'], other:['其他','◇']
};
const assetId=new URLSearchParams(location.search).get('id')||'';
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtDate(value){
  if(!value)return '—';
  const date=new Date(/[zZ]|[+-]\d\d:?\d\d$/.test(value)?value:value+'Z');
  return Number.isNaN(date.getTime())?'—':date.toLocaleString('zh-CN');
}
function row(label,value){return `<div class="row"><span class="key">${label}</span><span class="value">${value||'—'}</span></div>`;}
function render(asset){
  const [typeLabel,typeIcon]=ASSET_TYPES[asset.asset_type]||ASSET_TYPES.other;
  const status=asset.online_status||'unknown';
  const statusLabel=status==='online'?'● 在线':status==='offline'?'○ 离线':'— 未检测';
  const checkedAt=asset.source==='manual'?asset.last_ping_at:asset.last_seen;
  document.title=asset.hostname+' · 资产详情';
  document.getElementById('content').innerHTML=`
    <header class="header">
      <div class="header-row"><div class="type-icon">${typeIcon}</div><div>
        <h1>${esc(asset.hostname)}</h1>
        <div class="sub">${typeLabel} · ${asset.source==='agent'?'Agent 自动采集':'手工录入'}</div>
      </div></div>
      <span class="status ${status}">${statusLabel}</span>
    </header>
    <section class="section"><h2>资产信息</h2>
      ${row('厂商 / 型号',(esc(asset.manufacturer)||'—')+' / '+(esc(asset.model)||'—'))}
      ${row('序列号',esc(asset.serial_number))}
      ${row('资产标签',esc(asset.asset_tag))}
      ${row('IP 地址',esc(asset.ip))}
      ${row('MAC 地址',esc(asset.mac_address))}
    </section>
    <section class="section"><h2>归属信息</h2>
      ${row('部门',esc(asset.department))}
      ${row('责任人',esc(asset.owner))}
      ${row('位置',esc(asset.location))}
      ${asset.notes?row('备注',esc(asset.notes)):''}
    </section>
    <section class="section"><h2>状态</h2>
      ${row(asset.source==='manual'?'最后 Ping':'最后上报',fmtDate(checkedAt))}
      ${asset.ping_latency_ms!=null?row('Ping 延迟',esc(asset.ping_latency_ms)+' ms'):''}
    </section>
    <button class="back" onclick="history.length>1?history.back():location.href='/'">返回</button>`;
  document.getElementById('loading').hidden=true;
  document.getElementById('content').hidden=false;
}
async function loadAsset(){
  if(!assetId)throw new Error('二维码中缺少资产 ID');
  const response=await fetch(`/api/public/assets/${encodeURIComponent(assetId)}`,{cache:'no-store'});
  const data=await response.json().catch(()=>({}));
  if(!response.ok)throw new Error(data.error==='not found'?'资产不存在':data.error||'无法获取资产信息');
  render(data);
}
loadAsset().catch(error=>{
  document.getElementById('loading').hidden=true;
  const target=document.getElementById('error');
  target.hidden=false;
  target.textContent=error.message;
});
</script>
</body>
</html>
