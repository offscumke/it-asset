<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IT 资产管理系统</title>
<style>
:root{
  --bg:#090e13;--surface:#111820;--surface-2:#16212b;--surface-3:#1b2834;
  --border:#263543;--border-strong:#34495a;--text:#edf4f8;--muted:#93a4b1;--subtle:#667886;
  --teal:#2dd4bf;--teal-soft:#0c302d;--blue:#60a5fa;--blue-soft:#102a46;
  --amber:#fbbf24;--amber-soft:#35280c;--violet:#a78bfa;--violet-soft:#2b2045;
  --orange:#fb923c;--orange-soft:#3a2110;--green:#34d399;--green-soft:#0c2d22;
  --red:#fb7185;--red-soft:#37161d;--shadow:0 18px 48px rgba(0,0,0,.32)
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;letter-spacing:0}
button,input,select,textarea{font:inherit;letter-spacing:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.login-box{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:34px;width:min(400px,100%);box-shadow:var(--shadow)}
.login-brand{display:flex;align-items:center;gap:14px;margin-bottom:28px}
.brand-mark{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;background:var(--teal-soft);border:1px solid #17675d;color:var(--teal);font-size:14px;font-weight:800}
.login-box h1{font-size:20px;font-weight:750;color:var(--text);margin-bottom:4px}
.login-box p{font-size:13px;color:var(--muted)}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;margin-bottom:7px;font-weight:700}
.form-group input{width:100%;height:44px;background:#0b1117;border:1px solid var(--border);border-radius:8px;padding:0 13px;color:var(--text);font-size:14px;outline:none;transition:border-color .15s,box-shadow .15s}
.form-group input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(45,212,191,.1)}
.btn-login{width:100%;height:44px;background:var(--teal);color:#06201d;border:none;border-radius:8px;font-size:14px;font-weight:800;cursor:pointer;margin-top:6px;transition:filter .15s,transform .15s}
.btn-login:hover{filter:brightness(1.08)}.btn-login:active{transform:translateY(1px)}
.login-err{color:var(--red);font-size:13px;text-align:center;margin-top:12px;min-height:20px}
#app{display:none;min-height:100vh}
header{height:64px;background:rgba(17,24,32,.96);padding:0 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:22px;position:sticky;top:0;z-index:50}
.app-brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
.app-brand-mark{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--teal-soft);border:1px solid #17675d;color:var(--teal);font-size:11px;font-weight:800}
header h1{font-size:15px;font-weight:750;color:var(--text)}
header .spacer{flex:1}
.nav{display:flex;gap:3px;background:#0b1117;border:1px solid var(--border);padding:3px;border-radius:8px}
.nav button{height:34px;background:none;border:none;color:var(--muted);padding:0 15px;border-radius:6px;font-size:13px;cursor:pointer;font-weight:650}
.nav button.active{background:var(--teal);color:#06201d}
#tab-inventory.active{background:var(--orange);color:#251104}
.nav button:hover:not(.active){background:var(--surface-2);color:var(--text)}
.user-badge{display:flex;align-items:center;height:32px;padding:0 11px;border-radius:8px;background:var(--surface-2);color:var(--muted);font-size:12px;border:1px solid var(--border)}
.btn-logout{height:32px;background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:8px;padding:0 12px;font-size:12px;cursor:pointer}
.btn-logout:hover{color:var(--red);border-color:#6d2a36}
.container{padding:28px 24px 44px;max-width:1560px;margin:0 auto}
.tab-page{display:none}.tab-page.active{display:block}
.page-heading{display:flex;align-items:end;justify-content:space-between;margin-bottom:18px;gap:16px}
.page-heading h2{font-size:22px;line-height:1.2;font-weight:760}
.page-kicker{font-size:11px;text-transform:uppercase;color:var(--teal);font-weight:800;margin-bottom:6px}
.page-kicker.inventory{color:var(--orange)}
.page-state{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}
.page-state::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(52,211,153,.08)}
.page-state.inventory::before{background:var(--orange);box-shadow:0 0 0 4px rgba(251,146,60,.08)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.stat-card{min-height:104px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:17px 18px;display:flex;align-items:center;gap:14px;position:relative;overflow:hidden}
.stat-card::after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--stat-color)}
.stat-icon{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;background:var(--stat-soft);color:var(--stat-color);font-size:16px;font-weight:800;flex:0 0 auto}
.stat-total{--stat-color:var(--teal);--stat-soft:var(--teal-soft)}
.stat-online{--stat-color:var(--green);--stat-soft:var(--green-soft)}
.stat-agent{--stat-color:var(--blue);--stat-soft:var(--blue-soft)}
.stat-manual{--stat-color:var(--amber);--stat-soft:var(--amber-soft)}
.stat-card .label{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700}
.stat-card .value{font-size:29px;line-height:1;font-weight:780;margin-top:7px;color:var(--stat-color)}
.toolbar{display:grid;grid-template-columns:minmax(260px,1fr) auto auto;gap:10px;margin-bottom:14px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px}
.toolbar-search{height:38px;display:flex;align-items:center;gap:8px;background:#0b1117;border:1px solid var(--border);border-radius:8px;padding:0 12px}
.toolbar-search span{color:var(--subtle);font-size:18px}
.toolbar input,.toolbar select{height:38px;background:#0b1117;border:1px solid var(--border);border-radius:8px;padding:0 12px;color:var(--text);font-size:13px;outline:none}
.toolbar-search input{height:auto;background:transparent;border:0;padding:0;min-width:0;width:100%}
.toolbar input::placeholder{color:var(--subtle)}
.toolbar input:focus,.toolbar select:focus{border-color:var(--teal)}
.toolbar-search:focus-within{border-color:var(--teal);box-shadow:0 0 0 3px rgba(45,212,191,.08)}
.toolbar-filters,.toolbar-actions{display:flex;align-items:center;gap:8px}
.toolbar select{min-width:120px}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:8px;background:var(--surface);scrollbar-color:var(--border-strong) transparent}
table{width:100%;border-collapse:collapse;background:var(--surface)}
.table-wrap table{border:0;min-width:1080px}
.table-wrap .asset-list{min-width:1320px}
thead tr{background:#0d151c}
th{padding:12px 14px;text-align:left;font-size:10px;color:var(--subtle);text-transform:uppercase;font-weight:800;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:13px 14px;font-size:13px;border-bottom:1px solid #1b2833;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{transition:background .15s}tbody tr:hover{background:#141f28}
.asset-name{font-size:13px;font-weight:720;color:var(--text)}
.asset-meta{font-size:11px;color:var(--subtle);margin-top:4px}
.hardware-summary{display:grid;grid-template-columns:repeat(3,minmax(82px,1fr));gap:6px;min-width:270px}
.hardware-item{display:flex;align-items:center;gap:6px;min-width:0;padding:6px 7px;background:#0b131a;border:1px solid var(--border);border-radius:6px}
.hardware-icon{width:25px;height:25px;display:grid;place-items:center;border-radius:5px;font-size:8px;font-weight:850;flex:0 0 auto}
.hardware-cpu .hardware-icon{background:var(--blue-soft);color:var(--blue)}
.hardware-memory .hardware-icon{background:var(--teal-soft);color:var(--teal)}
.hardware-disk .hardware-icon{background:var(--amber-soft);color:var(--amber)}
.hardware-copy{display:flex;flex-direction:column;gap:2px;min-width:0}
.hardware-label{font-size:9px;color:var(--subtle);font-weight:800;line-height:1}
.hardware-number{font-size:11px;color:var(--text);font-weight:760;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hardware-sub{font-size:9px;color:var(--muted);white-space:nowrap}
.type-line{display:flex;align-items:center;gap:8px}
.type-glyph{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--violet-soft);color:var(--violet);flex:0 0 auto}
.type-computer{background:var(--blue-soft);color:var(--blue)}
.type-server,.type-storage{background:var(--violet-soft);color:var(--violet)}
.type-switch,.type-router,.type-wireless_ap{background:var(--teal-soft);color:var(--teal)}
.type-firewall{background:var(--red-soft);color:var(--red)}
.type-printer{background:var(--amber-soft);color:var(--amber)}
.type-other{background:var(--surface-3);color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:5px;min-height:24px;padding:0 9px;border-radius:20px;font-size:10px;font-weight:750;border:1px solid transparent;white-space:nowrap}
.badge.online{background:var(--green-soft);color:var(--green);border-color:#166047}
.badge.offline{background:var(--red-soft);color:var(--red);border-color:#722635}
.badge.unknown{background:#1c2730;color:var(--muted);border-color:var(--border-strong)}
.badge.manual{background:var(--amber-soft);color:var(--amber);border-color:#70530c}
.badge.agent{background:var(--blue-soft);color:var(--blue);border-color:#23578b}
.badge.in_use{background:var(--teal-soft);color:var(--teal);border-color:#17675d}
.badge.spare{background:var(--violet-soft);color:var(--violet);border-color:#58418d}
.badge.repair{background:var(--amber-soft);color:var(--amber);border-color:#70530c}
.badge.loaned{background:var(--blue-soft);color:var(--blue);border-color:#23578b}
.badge.retired{background:#1c2730;color:var(--muted);border-color:var(--border-strong)}
.badge.lost{background:var(--red-soft);color:var(--red);border-color:#722635}
.badge.open,.badge.done{background:var(--green-soft);color:var(--green)}
.badge.closed{background:#1c2730;color:var(--muted)}
.badge.miss{background:var(--orange-soft);color:var(--orange)}
.badge.win{background:var(--blue-soft);color:var(--blue)}.badge.mac{background:var(--violet-soft);color:var(--violet)}
.btn,.btn-primary,.btn-export{height:34px;cursor:pointer;border:1px solid transparent;border-radius:8px;padding:0 12px;font-size:12px;font-weight:720;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:filter .15s,background .15s,border-color .15s,transform .15s}
.btn:hover,.btn-primary:hover,.btn-export:hover{filter:brightness(1.1)}.btn:active,.btn-primary:active,.btn-export:active{transform:translateY(1px)}
.btn:disabled,.btn-primary:disabled,.btn-export:disabled{cursor:not-allowed;opacity:.45;filter:none;transform:none}
.btn-icon{width:34px;padding:0;font-size:16px}
.btn-detail{background:var(--teal-soft);color:var(--teal);border-color:#17675d}
.btn-edit{background:var(--blue-soft);color:var(--blue);border-color:#23578b}
.btn-qr{background:var(--violet-soft);color:var(--violet);border-color:#58418d}
.btn-vnc{background:var(--orange-soft);color:var(--orange);border-color:#7b421c}
.vnc-glyph{width:16px;height:12px;display:inline-block;border:2px solid currentColor;border-radius:2px;position:relative}
.vnc-glyph::before{content:'';position:absolute;left:5px;bottom:-5px;width:3px;height:3px;border-left:2px solid currentColor;border-right:2px solid currentColor}
.vnc-glyph::after{content:'';position:absolute;left:3px;right:3px;bottom:-7px;border-bottom:2px solid currentColor}
.btn-del{background:transparent;color:var(--red);border-color:#5f2530}
.btn-refresh{background:var(--surface-2);color:var(--muted);border-color:var(--border)}
.btn-primary{background:var(--teal);color:#06201d;padding:0 16px}
.btn-manual{background:var(--amber);color:#241800}
.btn-bulk{background:var(--blue-soft);color:var(--blue);border-color:#23578b}
.btn-inventory{background:var(--orange);color:#251104}
.btn-export{background:transparent;color:var(--green);border-color:#176047;padding:0 14px}
.action-group{display:flex;align-items:center;gap:6px}
.progress{background:#22303b;border-radius:4px;height:6px;margin-top:6px;min-width:90px;overflow:hidden}
.progress-bar{height:100%;border-radius:4px;background:var(--teal);transition:width .4s}
.progress-bar.warn{background:var(--amber)}.progress-bar.danger{background:var(--red)}
.empty{text-align:center;padding:64px;color:var(--subtle);font-size:13px}
.modal-bg{position:fixed;inset:0;background:rgba(2,6,10,.76);display:none;align-items:center;justify-content:center;padding:20px;z-index:100}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border-strong);border-radius:8px;padding:0;width:min(680px,100%);max-height:86vh;overflow-y:auto;box-shadow:var(--shadow)}
.modal.modal-wide{width:min(980px,100%)}
.modal h2{font-size:15px;font-weight:750;padding:18px 20px;margin-bottom:0;color:var(--text);display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:2}
.modal .close{margin-left:auto;width:32px;height:32px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:18px;cursor:pointer}
#modal-icon{color:var(--teal)}#modal-body{padding:20px}
.import-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.import-file{height:36px;display:inline-flex;align-items:center;justify-content:center;padding:0 14px;border-radius:8px;background:var(--blue);color:#061525;font-size:12px;font-weight:760;cursor:pointer}
.import-file input{display:none}
.import-empty{min-height:150px;border:1px dashed var(--border-strong);border-radius:8px;display:grid;place-items:center;color:var(--subtle);font-size:13px;text-align:center;padding:24px}
.import-summary{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0;color:var(--muted);font-size:12px}
.import-preview{border:1px solid var(--border);border-radius:8px;overflow:auto;max-height:360px}
.import-preview table{min-width:760px}.import-preview th{position:sticky;top:0;z-index:1}.import-preview td{font-size:12px}
.import-error{color:var(--red);font-size:12px;margin-top:12px;line-height:1.7}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.info-item{min-width:0}.info-item .key,.info-item>label{font-size:10px;color:var(--subtle);text-transform:uppercase;font-weight:800}
.info-item .val{font-size:13px;margin-top:5px;color:var(--text);font-weight:600;word-break:break-word}
.info-item input,.info-item select,.info-item textarea,.sw-search{width:100%;background:#0b1117;border:1px solid var(--border);border-radius:8px;padding:9px 10px;color:var(--text);font-size:13px;margin-top:5px;outline:none}
.info-item input,.info-item select{height:38px}
.info-item input:focus,.info-item select:focus,.info-item textarea:focus,.sw-search:focus{border-color:var(--teal)}
.info-item textarea{min-height:78px;resize:vertical}
.info-item.full{grid-column:1/-1}
.toggle-row{display:flex;align-items:center;gap:9px;margin-top:14px;color:var(--muted);font-size:13px}
.toggle-row input{width:17px;height:17px;margin:0;accent-color:var(--teal)}
.sw-list{margin-top:20px;border-top:1px solid var(--border);padding-top:16px}
.sw-list h3{font-size:10px;color:var(--subtle);text-transform:uppercase;margin-bottom:10px;font-weight:800}
.sw-search{margin:0 0 10px}
.sw-scroll{max-height:220px;overflow-y:auto}
.sw-item{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--border);font-size:12px}
.sw-ver{color:var(--subtle);font-size:11px}
.record-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;background:var(--muted)}
.record-dot.done{background:var(--green)}.record-dot.missing{background:var(--amber)}
.qr-box{text-align:center;padding:4px}
.qr-box img{background:#fff;padding:10px;border-radius:8px;width:260px;height:260px;box-shadow:0 10px 30px rgba(0,0,0,.28)}
.qr-box p{margin-top:12px;font-size:13px;color:var(--muted)}
.toast{position:fixed;right:20px;bottom:20px;z-index:200;max-width:380px;padding:12px 16px;border-radius:8px;background:var(--green-soft);border:1px solid #176047;color:var(--green);font-size:13px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translateY(0)}.toast.error{background:var(--red-soft);border-color:#722635;color:var(--red)}
@media(max-width:1100px){
  .toolbar{grid-template-columns:1fr}.toolbar-filters,.toolbar-actions{flex-wrap:wrap}
}
@media(max-width:800px){
  header{height:auto;min-height:60px;padding:10px 12px;gap:10px;flex-wrap:wrap}
  .app-brand{margin-right:auto}.app-brand h1{font-size:14px}
  .nav{order:3;width:100%}.nav button{flex:1}.user-badge{display:none}
  .container{padding:20px 12px 34px}.page-heading{align-items:center}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .stat-card{min-height:88px;padding:13px}.stat-icon{width:32px;height:32px}.stat-card .value{font-size:24px}
  .toolbar{padding:8px}.toolbar-filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%}
  .toolbar-filters select{width:100%;min-width:0}.toolbar-filters select:last-child{grid-column:1/-1}
  .toolbar-actions{width:100%}.toolbar-actions .btn-primary{flex:1}
  .modal-bg{padding:10px}.modal{max-height:92vh}.modal h2{padding:14px 16px}#modal-body{padding:16px}
  .info-grid{grid-template-columns:1fr}.info-item.full{grid-column:auto}
}
@media(max-width:420px){
  .page-heading h2{font-size:20px}.page-state{display:none}
  .stat-card{gap:10px}.stat-icon{display:none}
  .toolbar-actions{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto auto}
  .toolbar-actions .btn-export{width:38px;padding:0}.toolbar-actions .btn-export .export-label{display:none}.toolbar-actions .btn-export .export-icon{font-size:17px}
}
</style>
</head>
<body>
<div class="login-wrap" id="login-page">
  <div class="login-box">
    <div class="login-brand">
      <div class="brand-mark">IT</div>
      <div><h1>资产管理中心</h1><p>管理员登录</p></div>
    </div>
    <div class="form-group"><label>用户名</label>
      <input id="l-user" type="text" value="admin" autocomplete="username"></div>
    <div class="form-group"><label>密码</label>
      <input id="l-pass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="btn-login" onclick="doLogin()">登 录</button>
    <div class="login-err" id="l-err"></div>
  </div>
</div>

<div id="app">
  <header>
    <div class="app-brand"><div class="app-brand-mark">IT</div><h1>资产管理中心</h1></div>
    <div class="nav">
      <button id="tab-assets" class="active" onclick="switchTab('assets')">资产清单</button>
      <button id="tab-inventory" onclick="switchTab('inventory')">盘点管理</button>
    </div>
    <div class="spacer"></div>
    <span class="user-badge" id="user-badge"></span>
    <button class="btn-logout" onclick="logout()">退出</button>
  </header>
  <div class="container">

    <!-- ASSETS TAB -->
    <div class="tab-page active" id="page-assets">
      <div class="page-heading">
        <div><div class="page-kicker">Assets</div><h2>资产总览</h2></div>
        <div class="page-state">服务正常</div>
      </div>
      <div class="stats">
        <div class="stat-card stat-total"><div class="stat-icon">Σ</div><div><div class="label">总资产</div><div class="value" id="s-total">0</div></div></div>
        <div class="stat-card stat-online"><div class="stat-icon">●</div><div><div class="label">在线</div><div class="value" id="s-online">0</div></div></div>
        <div class="stat-card stat-agent"><div class="stat-icon">A</div><div><div class="label">Agent 电脑</div><div class="value" id="s-agent">0</div></div></div>
        <div class="stat-card stat-manual"><div class="stat-icon">M</div><div><div class="label">手工资产</div><div class="value" id="s-manual">0</div></div></div>
      </div>
      <div class="toolbar">
        <div class="toolbar-search"><span>⌕</span><input id="search" placeholder="搜索名称、IP、标签、部门或责任人" oninput="filterAssets()"></div>
        <div class="toolbar-filters">

<script>
let token = localStorage.getItem('it_token') || '';
let allAssets = [];
let currentInventory = null;
let toastTimer = null;
let bulkAssets = [];

function showToast(message, error=false) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.className = 'toast show' + (error ? ' error' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.className = 'toast'; }, 3000);
}

function doLogin() {
  const u = document.getElementById('l-user').value.trim();
  const p = document.getElementById('l-pass').value;
  document.getElementById('l-err').textContent = '';
  fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({username:u,password:p}) })
    .then(async r => {
      const d = await r.json();
      if (!r.ok) { document.getElementById('l-err').textContent = d.error||'登录失败'; return; }
      token = d.token; localStorage.setItem('it_token', token); showApp(u);
    }).catch(()=>document.getElementById('l-err').textContent='无法连接服务器');
}

function showApp(username) {
  document.getElementById('login-page').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('user-badge').textContent = username||'';
  loadAssets();
}

function logout() {
  token=''; localStorage.removeItem('it_token'); allAssets=[];
  document.getElementById('app').style.display='none';
  document.getElementById('login-page').style.display='flex';
  document.getElementById('l-pass').value='';
  document.getElementById('modal').classList.remove('open');
}

async function apiFetch(path, opts={}) {
  const r = await fetch(path, { ...opts,
    cache:'no-store',
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json',...(opts.headers||{})} });
  if (r.status===401) { logout(); return null; }
  return r;
}

function switchTab(tab) {
  document.getElementById('tab-assets').classList.toggle('active', tab==='assets');
  document.getElementById('tab-inventory').classList.toggle('active', tab==='inventory');
  document.getElementById('page-assets').classList.toggle('active', tab==='assets');
  document.getElementById('page-inventory').classList.toggle('active', tab==='inventory');
  if (tab==='inventory') loadSessions();
}

const ASSET_TYPES = {
  computer:['电脑','PC'], server:['服务器','SR'], switch:['交换机','SW'],
  firewall:['防火墙','FW'], router:['路由器','RT'], wireless_ap:['无线 AP','AP'],
  printer:['打印机','PR'], storage:['存储','ST'], other:['其他','OT']
};
const LIFECYCLE_TYPES = {
  in_use:['在用','IN'], spare:['备用','SP'], repair:['维修','RE'],
  loaned:['借出','LO'], retired:['已报废','RT'], lost:['丢失','LS']
};
const EVENT_LABELS = {
  agent_create:'Agent 首次上报',
  agent_rename:'Agent 主机名变更',
  manual_create:'手工录入',
  manual_update:'手工更新',
  asset_update:'资产更新',
  bulk_create:'批量导入',
  bulk_update:'批量更新',
  inventory_scan:'盘点记录'
};
function esc(value){ return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function isOnline(a){ return a?.online_status==='online'; }
function fmtBytes(b){
  const bytes=Number(b);
  if(!Number.isFinite(bytes)||bytes<=0)return '—';
  if(bytes>=1e12)return (bytes/1e12).toFixed(1)+' TB';
  if(bytes>=1e9)return (bytes/1e9).toFixed(1)+' GB';
  return (bytes/1e6).toFixed(0)+' MB';
}
function fmtDate(d){ return d?new Date(d+'Z').toLocaleString('zh-CN'):'—'; }
function pct(u,t){ return t?Math.round(u/t*100):0; }
function bar(p){ const c=p>90?'danger':p>70?'warn':''; return `<div class="progress"><div class="progress-bar ${c}" style="width:${p}%"></div></div>`; }
function typeMeta(type){ return ASSET_TYPES[type]||ASSET_TYPES.other; }
function lifecycleMeta(status){ return LIFECYCLE_TYPES[status]||LIFECYCLE_TYPES.in_use; }
function lifecycleOptions(selected=''){
  return Object.entries(LIFECYCLE_TYPES).map(([value,[label]]) =>
    `<option value="${value}" ${value===selected?'selected':''}>${label}</option>`).join('');
}
function lifecycleLabel(status){ return lifecycleMeta(status)[0]; }
function eventActionLabel(action){ return EVENT_LABELS[action] || action; }
function hardwareSummary(a){
  if(a.source!=='agent')return '<span class="asset-meta">手工资产无采集数据</span>';
  const cpu=esc(a.cpu)||'未知 CPU';
  const cores=a.cpu_cores?`${esc(a.cpu_cores)} 核`:'核心数未知';
  return `<div class="hardware-summary" aria-label="CPU、内存、硬盘">
    <div class="hardware-item hardware-cpu" title="CPU：${cpu}，${cores}">

    </div>
    <div class="hardware-item hardware-memory" title="内存：${fmtBytes(a.ram_total)}">
      <span class="hardware-icon">RAM</span><span class="hardware-copy"><span class="hardware-label">内存</span><strong class="hardware-number">${fmtBytes(a.ram_total)}</strong><span class="hardware-sub">总容量</span></span>
    </div>
    <div class="hardware-item hardware-disk" title="硬盘：${fmtBytes(a.disk_total)}">
      <span class="hardware-icon">DISK</span><span class="hardware-copy"><span class="hardware-label">硬盘</span><strong class="hardware-number">${fmtBytes(a.disk_total)}</strong><span class="hardware-sub">总容量</span></span>
    </div>

}
function typeOptions(selected='', includeComputer=true){
  return Object.entries(ASSET_TYPES).filter(([value])=>includeComputer||value!=='computer').map(([value,[label]]) =>
    `<option value="${value}" ${value===selected?'selected':''}>${label}</option>`).join('');

      .concat(lifecycleLabel(a.lifecycle_status)).filter(Boolean).join(' ').toLowerCase();
    return (!q||text.includes(q))&&(!type||a.asset_type===type)&&
      (!lifecycle||a.lifecycle_status===lifecycle)&&

// ── Bulk Import ──────────────────────────────────────────────────────────────
function parseCSV(text) {
  const rows = [];
  let row = [];
  let field = '';
  let quoted = false;
  const source = String(text || '').replace(/^\uFEFF/, '');

  for (let index = 0; index < source.length; index += 1) {
    const char = source[index];
    if (quoted) {
      if (char === '"' && source[index + 1] === '"') {
        field += '"';
        index += 1;
      } else if (char === '"') {
        quoted = false;
      } else {
        field += char;
      }
    } else if (char === '"') {
      quoted = true;
    } else if (char === ',') {
      row.push(field);
      field = '';
    } else if (char === '\n') {
      row.push(field);
      if (row.some(value => value.trim())) rows.push(row);
      row = [];
      field = '';
    } else if (char !== '\r') {
      field += char;
    }
  }
  if (quoted) throw new Error('CSV 中存在未闭合的引号');
  row.push(field);
  if (row.some(value => value.trim())) rows.push(row);
  return rows;
}

function openBulkImport() {
  bulkAssets = [];
  document.querySelector('#modal .modal').classList.add('modal-wide');
  document.getElementById('modal-name').textContent = '批量录入资产';
  document.getElementById('modal-icon').textContent = 'CSV';
  document.getElementById('modal-body').innerHTML = `
    <div class="import-actions">
      <label class="import-file">选择 CSV<input type="file" accept=".csv,text/csv" onchange="handleBulkFile(this)"></label>
      <button class="btn btn-export" onclick="downloadBulkTemplate()">⇩ 下载模板</button>
    </div>
    <div id="bulk-content" class="import-empty">尚未选择文件</div>
    <div id="bulk-result" class="import-error"></div>`;
  document.getElementById('modal').classList.add('open');
}

async function handleBulkFile(input) {
  const file = input.files?.[0];
  if (!file) return;
  const content = document.getElementById('bulk-content');
  const result = document.getElementById('bulk-result');
  result.textContent = '';
  try {
    const rows = parseCSV(await file.text());
    if (rows.length < 2) throw new Error('CSV 没有资产数据');
    const headers = rows[0].map(value => value.trim());
    const required = ['hostname', 'asset_type'];
    const missing = required.filter(name => !headers.includes(name));
    if (missing.length) throw new Error(`缺少字段：${missing.join(', ')}`);
    bulkAssets = rows.slice(1).map(row => Object.fromEntries(
      headers.map((header, index) => [header, (row[index] || '').trim()])
    ));
    if (!bulkAssets.length) throw new Error('CSV 没有资产数据');
    if (bulkAssets.length > 500) throw new Error('单次最多导入 500 条资产');
    renderBulkPreview(file.name);
  } catch (error) {
    bulkAssets = [];
    content.className = 'import-empty';
    content.textContent = error.message || 'CSV 解析失败';
  }
}

function renderBulkPreview(filename) {
  const invalidRows = bulkAssets.filter(asset =>

  const preview = bulkAssets.slice(0, 20);
  document.getElementById('bulk-content').className = '';
  document.getElementById('bulk-content').innerHTML = `
    <div class="import-summary"><span>${esc(filename)} · ${bulkAssets.length} 条</span>
      <span>${invalidRows.length ? `${invalidRows.length} 条需修正` : '格式检查通过'}</span></div>
    <div class="import-preview"><table><thead><tr>
      <th>资产名称</th><th>类型</th><th>IP</th><th>部门</th><th>责任人</th><th>位置</th>
    </tr></thead><tbody>${preview.map(asset => {
      const valid = asset.hostname && ASSET_TYPES[asset.asset_type] && asset.asset_type !== 'computer';
      return `<tr><td>${esc(asset.hostname) || '<span class="import-error">缺少名称</span>'}</td>
        <td>${valid ? esc(typeMeta(asset.asset_type)[0]) : '<span class="import-error">类型无效</span>'}</td>
        <td>${esc(asset.ip) || '—'}</td><td>${esc(asset.department) || '—'}</td>
        <td>${esc(asset.owner) || '—'}</td><td>${esc(asset.location) || '—'}</td></tr>`;
    }).join('')}</tbody></table></div>
    ${bulkAssets.length > preview.length ? `<div class="import-summary"><span>仅预览前 ${preview.length} 条</span></div>` : ''}
    <button id="bulk-submit" class="btn-primary" style="margin-top:16px;width:100%" onclick="submitBulkImport()" ${invalidRows.length ? 'disabled' : ''}>导入 ${bulkAssets.length} 条资产</button>`;
  if (invalidRows.length) {
    document.getElementById('bulk-result').textContent = '电脑类资产须由 Agent 上报；请修正空名称或无效类型后重新选择文件。';
  }
}

async function submitBulkImport() {
  if (!bulkAssets.length) return;
  const button = document.getElementById('bulk-submit');
  button.disabled = true;
  button.textContent = '正在导入...';
  const response = await apiFetch('/api/assets/bulk', {
    method: 'POST', body: JSON.stringify({ assets: bulkAssets })
  });
  if (!response) return;
  const data = await response.json().catch(() => ({}));
  if (!response.ok) {
    button.disabled = false;
    button.textContent = `导入 ${bulkAssets.length} 条资产`;
    showToast(data.error || '批量导入失败', true);
    return;
  }

  await loadAssets();
  const issues = [...(data.errors || []), ...(data.skipped || [])];
  if (!issues.length) {
    closeModal();
    showToast(`批量导入完成：新增 ${data.created}，更新 ${data.updated}`);
    return;
  }
  button.disabled = false;
  button.textContent = `重新导入 ${bulkAssets.length} 条资产`;
  document.getElementById('bulk-result').innerHTML =
    `已新增 ${data.created}，更新 ${data.updated}；${issues.length} 条未处理。<br>` +
    issues.slice(0, 8).map(item => `${esc(item.hostname || item.item?.hostname || '未命名')}：${esc(item.error || item.reason)}`).join('<br>');
  showToast('批量导入部分完成，请查看错误明细', true);
}

async function saveAsset(id) {
  const asset = allAssets.find(a=>a.id===id);
  if (!asset) return;
  const data = {
    manufacturer: document.getElementById('e-manufacturer').value || null,
    model: document.getElementById('e-model').value || null,
    serial_number: document.getElementById('e-serial').value || null,
    lifecycle_status: document.getElementById('e-lifecycle').value,
    department: document.getElementById('e-dept').value,
    owner: document.getElementById('e-owner').value,
    location: document.getElementById('e-loc').value,
    asset_tag: document.getElementById('e-tag').value,
    notes: document.getElementById('e-notes').value || null
  };
  if (asset.source === 'manual') {
    const hostname=document.getElementById('e-hostname').value.trim();
    if (!hostname) { showToast('资产名称不能为空',true); return; }
    Object.assign(data, {
      hostname,
      asset_type: document.getElementById('e-type').value,
      ip: document.getElementById('e-ip').value || null,
      mac_address: document.getElementById('e-mac').value || null,
      ping_enabled: document.getElementById('e-ping').checked
    });
  }
  const r = await apiFetch(`/api/assets/${id}`, { method:'PATCH', body: JSON.stringify(data) });
  if (!r) return;
  const result=await r.json().catch(()=>({}));
  if (!r.ok) { showToast(result.error||'保存失败',true); return; }
  closeModal(); await loadAssets(); showToast('资产信息已保存');
}

async function pingAsset(id, keepModal=false) {
  const asset=allAssets.find(a=>a.id===id);
  const r=await apiFetch(`/api/assets/${id}/ping`,{method:'POST'});
  if(!r)return;
  const result=await r.json().catch(()=>({}));
  if(!r.ok){showToast(result.error||'Ping 检测失败',true);return;}
  await loadAssets();
  showToast(`${asset?.hostname||'资产'}：${result.online_status==='online'?'在线':'离线'}${result.ping_latency_ms!=null?' · '+result.ping_latency_ms+' ms':''}`,
    result.online_status!=='online');

}

async function deleteAsset(id) {
  const asset=allAssets.find(a=>a.id===id);
  if(!asset)return;
  const note=asset.source==='agent'?'\n\n该设备的 Agent 若仍在运行，下次上报时会重新加入。':'';
  if(!confirm(`删除资产 "${asset.hostname}"？${note}`)) return;
  try {
    const r = await apiFetch(`/api/assets/${id}`, { method:'DELETE' });
    if(!r) return;
    const data = await r.json().catch(() => ({}));
    if(!r.ok) throw new Error(data.error || '删除失败');
    allAssets = allAssets.filter(a => a.id !== id);
    refreshAssetFilters();
    filterAssets();
    showToast(`已删除资产：${asset.hostname}`);
  } catch (error) {
    showToast(error.message || '删除失败，请稍后重试', true);
  }
}

function closeModal(){
  document.getElementById('modal').classList.remove('open');
  document.querySelector('#modal .modal').classList.remove('modal-wide');
  bulkAssets = [];
}

async function downloadWithAuth(url, filename) {
  try {
    const r = await apiFetch(url); if(!r) return;
    if(!r.ok) {
      const data = await r.json().catch(() => ({}));
      throw new Error(data.error || '导出失败');
    }
    const blob = await r.blob();
    if(!blob.size) throw new Error('导出文件为空');
    const href = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = href;
    a.download = filename;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(href), 1000);
    showToast(`已导出：${filename}`);
  } catch (error) {
    showToast(error.message || '导出失败，请稍后重试', true);
  }
}

    const encodedName=encodeURIComponent(s.name);
    return `<tr>
    <td><div class="asset-name">${esc(s.name)}</div><div class="asset-meta">${s.status==='open'?'进行中':'已归档'}</div></td>

async function createSession() {
  const name = document.getElementById('new-session').value.trim();

async function closeSession(id) {
  if(!confirm('结束此盘点场次？结束后不能再扫码。')) return;
  try {
    const r = await apiFetch(`/api/inventory/${id}/close`, { method:'PATCH' });
    if(!r) return;
    const data = await r.json().catch(() => ({}));
    if(!r.ok) throw new Error(data.error || '结束盘点失败');
    await loadSessions();
    showToast(data.already_closed ? '该盘点已经结束' : '盘点已结束');
  } catch (error) {
    showToast(error.message || '结束盘点失败，请稍后重试', true);

async function deleteSession(id,n){ if(!confirm(`删除盘点场次 "${n}"？记录一并删除。`))return; await apiFetch(`/api/inventory/${id}`,{method:'DELETE'}); loadSessions(); }

function copyScanLink(id){
  const url = `${location.origin}/scan?session=${id}`;
  navigator.clipboard?.writeText(url).then(()=>alert('扫码盘点链接已复制:\n'+url+'\n\n用手机打开即可扫码盘点'),()=>prompt('复制此链接用手机打开:',url));
}

async function openSession(id, name) {
  currentInventory = id;
  const [statsR, recR] = await Promise.all([
    apiFetch(`/api/inventory/${id}/stats`), apiFetch(`/api/inventory/${id}/records`)]);
  if(!statsR||!recR) return;
  const stats = await statsR.json(); const records = await recR.json();
  document.getElementById('modal-name').textContent = name;
  document.getElementById('modal-icon').textContent='IN';
  const scannedIds = new Set(records.map(r=>r.asset_id));
  const missing = allAssets.filter(a=>!scannedIds.has(a.id));
  document.getElementById('modal-body').innerHTML=`
    <div class="stats" style="grid-template-columns:repeat(3,1fr);margin-bottom:16px">
      <div class="stat-card stat-total"><div><div class="label">资产总数</div><div class="value">${stats.total}</div></div></div>
      <div class="stat-card stat-online"><div><div class="label">已盘点</div><div class="value">${stats.scanned}</div></div></div>
      <div class="stat-card stat-manual"><div><div class="label">未盘点</div><div class="value">${stats.missing}</div></div></div>
    </div>
    ${bar(pct(stats.scanned,stats.total))}
    <div style="display:flex;gap:8px;margin:14px 0"><button class="btn-export" onclick="downloadWithAuth('/api/reports/inventory/${id}.csv','盘点-${name}.csv')">⇩ 导出报表</button>
    <button class="btn-primary btn-inventory" onclick="copyScanLink('${id}')">▦ 扫码链接</button></div>
    <div class="sw-list"><h3>已盘点 (${records.length})</h3><div class="sw-scroll">
      ${records.map(r=>`<div class="sw-item"><span><i class="record-dot done"></i>${esc(r.hostname)} <span style="color:var(--subtle)">· ${esc(r.scanned_location||r.asset_location||'无位置')}</span></span><span class="sw-ver">${esc(r.scanned_by)} ${fmtDate(r.scanned_at)}</span></div>`).join('')||'<div style="color:var(--subtle);padding:8px 0">暂无</div>'}
    </div></div>
    <div class="sw-list"><h3 style="color:var(--amber)">未盘点 (${missing.length})</h3><div class="sw-scroll">
      ${missing.map(a=>`<div class="sw-item"><span><i class="record-dot missing"></i>${esc(a.hostname)}</span><span class="sw-ver">${esc(a.location||'无位置')}</span></div>`).join('')||'<div style="color:var(--green);padding:8px 0">全部已盘点</div>'}
    </div></div>`;
  document.getElementById('modal').classList.add('open');
}
