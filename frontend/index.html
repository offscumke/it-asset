<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>IT 资产管理中心</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <section class="login-screen" id="login-page">
    <form class="login-panel" id="login-form">
      <div class="brand-lockup">
        <span class="brand-mark">IT</span>
        <span><strong>资产管理中心</strong><small>单公司 ITAM</small></span>
      </div>
      <div class="field">
        <label for="login-user">用户名</label>
        <input id="login-user" name="username" type="text" value="admin" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="login-pass">密码</label>
        <input id="login-pass" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="button button-primary button-block" type="submit">登录</button>
      <p class="form-error" id="login-error" role="alert"></p>
    </form>
  </section>

  <div class="app-shell" id="app" hidden>
    <header class="app-header">
      <div class="app-brand">
        <span class="brand-mark brand-mark-small">IT</span>
        <span><strong>资产管理中心</strong><small id="role-caption">运营工作台</small></span>
      </div>
      <nav class="primary-nav" id="primary-nav" aria-label="主导航"></nav>
      <div class="header-tools">
        <button class="icon-button notification-button" data-action="navigate" data-page="notifications" title="通知" aria-label="通知"><span aria-hidden="true">●</span><span class="notification-count" id="notification-count" hidden>0</span></button>
        <span class="user-chip" id="user-badge"></span>
        <button class="button button-quiet" data-action="logout">退出</button>
      </div>
    </header>

    <main class="main-content" id="main-content" tabindex="-1"></main>
  </div>

  <div class="modal-backdrop" id="modal" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <div><span class="eyebrow" id="modal-kicker">工作区</span><h2 id="modal-title">详情</h2></div>
        <button class="icon-button" data-action="close-modal" title="关闭" aria-label="关闭">×</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
