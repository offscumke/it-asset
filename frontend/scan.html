<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>资产盘点 · 扫码</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f1117;color:#e2e8f0;min-height:100vh;padding:16px}
.card{background:#1a1d2e;border:1px solid #2d3348;border-radius:14px;padding:20px;max-width:480px;margin:0 auto 16px}
h1{font-size:18px;color:#7c85f3;margin-bottom:4px}
.sub{font-size:13px;color:#64748b;margin-bottom:16px}
label{display:block;font-size:12px;color:#64748b;margin:12px 0 6px;text-transform:uppercase;letter-spacing:.05em}
input,select{width:100%;background:#0f1117;border:1px solid #2d3348;border-radius:8px;padding:12px;color:#e2e8f0;font-size:15px;outline:none}
input:focus,select:focus{border-color:#7c85f3}
button{width:100%;border:none;border-radius:8px;padding:14px;font-size:16px;font-weight:600;cursor:pointer;margin-top:16px;transition:opacity .15s}
button:active{opacity:.7}
.btn-primary{background:#7c85f3;color:#fff}
.btn-scan{background:#1e2a1e;color:#34d399;border:1px solid #065f46}
#reader{width:100%;border-radius:10px;overflow:hidden;margin-top:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#065f46;color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .3s;z-index:100}
.toast.show{opacity:1}
.toast.err{background:#7f1d1d}
.asset-info{background:#0f1117;border:1px solid #2d3348;border-radius:8px;padding:14px;margin-top:12px}
.asset-info .h{font-size:16px;font-weight:600;color:#e2e8f0}
.asset-info .r{font-size:13px;color:#64748b;margin-top:4px}
.hidden{display:none}
.count{display:flex;gap:12px;margin-top:14px}
.count-box{flex:1;background:#0f1117;border:1px solid #2d3348;border-radius:8px;padding:12px;text-align:center}
.count-box .n{font-size:22px;font-weight:700;color:#7c85f3}
.count-box .l{font-size:11px;color:#64748b;margin-top:2px}
</style>
</head>
<body>
<div class="card">
  <h1>📱 资产盘点</h1>
  <div class="sub" id="session-name">加载中…</div>

  <div class="count">
    <div class="count-box"><div class="n" id="c-total">0</div><div class="l">资产总数</div></div>
    <div class="count-box"><div class="n" style="color:#34d399" id="c-scanned">0</div><div class="l">已盘点</div></div>
    <div class="count-box"><div class="n" style="color:#f87171" id="c-missing">0</div><div class="l">未盘点</div></div>
  </div>

  <label>盘点场次</label>
  <select id="session-select" onchange="onSessionChange()"></select>

  <button class="btn-scan" id="scan-btn" onclick="toggleScanner()">📷 开启摄像头扫码</button>
  <div id="reader"></div>

  <label>或手动选择资产</label>
  <select id="asset-select"><option value="">— 选择资产 —</option></select>

  <div id="asset-info" class="asset-info hidden"></div>

  <label>实际位置（覆盖登记位置）</label>
  <input id="loc-input" placeholder="如：3楼研发部 A12 工位">

  <label>备注</label>
  <input id="note-input" placeholder="可选，如：外观正常">

  <label>盘点人</label>
  <input id="by-input" placeholder="你的名字">

  <button class="btn-primary" onclick="submitScan()">✓ 确认盘点</button>
</div>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
const params = new URLSearchParams(location.search);
let currentSession = params.get('session') || '';
let preselectAsset = params.get('id') || '';
let token = localStorage.getItem('it_token') || '';
let assets = [];
let scanner = null;
let scanning = false;

function toast(msg, err) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (err ? ' err' : '');
  setTimeout(() => t.className = 'toast', 2500);
}

async function api(path, opts={}) {
  const headers = { 'Content-Type':'application/json', ...(opts.headers||{}) };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  return fetch(path, { ...opts, headers });
}

async function loadSessions() {
  const r = await api('/api/inventory');
  if (!r.ok) { toast('请先在电脑端登录并创建盘点场次', true); return; }
  const sessions = await r.json();
  const open = sessions.filter(s => s.status === 'open');
  const sel = document.getElementById('session-select');
  sel.innerHTML = open.map(s => `<option value="${s.id}">${s.name}</option>`).join('')
    || '<option value="">无进行中的盘点</option>';
  if (currentSession) sel.value = currentSession;
  else currentSession = sel.value;
  updateSessionUI();
}

function updateSessionUI() {
  const sel = document.getElementById('session-select');
  document.getElementById('session-name').textContent =
    sel.options[sel.selectedIndex]?.text || '请选择盘点场次';
  loadStats();
}

function onSessionChange() {
  currentSession = document.getElementById('session-select').value;
  updateSessionUI();
}

async function loadStats() {
  if (!currentSession) return;
  const r = await api(`/api/inventory/${currentSession}/stats`);
  if (!r.ok) return;
  const s = await r.json();
  document.getElementById('c-total').textContent = s.total;
  document.getElementById('c-scanned').textContent = s.scanned;
  document.getElementById('c-missing').textContent = s.missing;
}

async function loadAssets() {
  const r = await api('/api/assets');
  if (!r.ok) return;
  assets = await r.json();
  const sel = document.getElementById('asset-select');
  sel.innerHTML = '<option value="">— 选择资产 —</option>' +
    assets.map(a => `<option value="${a.id}">${a.hostname} (${a.ip||'无IP'})</option>`).join('');
  sel.onchange = () => showAsset(sel.value);
  if (preselectAsset) { sel.value = preselectAsset; showAsset(preselectAsset); }
}

function showAsset(id) {
  const a = assets.find(x => x.id === id);
  const box = document.getElementById('asset-info');
  if (!a) { box.className = 'asset-info hidden'; return; }
  box.className = 'asset-info';
  box.innerHTML = `<div class="h">${a.platform==='darwin'?'🍎':'🪟'} ${a.hostname}</div>
    <div class="r">IP: ${a.ip||'—'} · ${a.os||''} ${a.os_version||''}</div>
    <div class="r">登记位置: ${a.location||'未设置'}</div>
    <div class="r">部门: ${a.department||'—'} · 标签: ${a.asset_tag||'—'}</div>`;
  if (a.location) document.getElementById('loc-input').value = a.location;
}

function toggleScanner() {
  if (scanning) { stopScanner(); return; }
  if (typeof Html5Qrcode === 'undefined') { toast('扫码库加载失败，请检查网络', true); return; }
  scanner = new Html5Qrcode('reader');
  scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: 250 },
    (decoded) => {
      let id = decoded;
      try { const u = new URL(decoded); id = u.searchParams.get('id') || decoded; } catch {}
      document.getElementById('asset-select').value = id;
      showAsset(id);
      toast('已识别: ' + (assets.find(a=>a.id===id)?.hostname || id));
      stopScanner();
    }, () => {});
  scanning = true;
  document.getElementById('scan-btn').textContent = '✕ 关闭摄像头';
}

function stopScanner() {
  if (scanner) scanner.stop().then(()=>scanner.clear()).catch(()=>{});
  scanning = false;
  document.getElementById('scan-btn').textContent = '📷 开启摄像头扫码';
}

async function submitScan() {
  const asset_id = document.getElementById('asset-select').value;
  if (!asset_id) { toast('请选择或扫描一个资产', true); return; }
  if (!currentSession) { toast('请选择盘点场次', true); return; }
  const r = await api(`/api/inventory/${currentSession}/scan`, {
    method: 'POST',
    body: JSON.stringify({
      asset_id,
      scanned_location: document.getElementById('loc-input').value,
      note: document.getElementById('note-input').value,
      scanned_by: document.getElementById('by-input').value
    })
  });
  const d = await r.json();
  if (!r.ok) { toast(d.error || '提交失败', true); return; }
  toast('✓ 已盘点: ' + d.hostname);
  document.getElementById('note-input').value = '';
  document.getElementById('asset-select').value = '';
  document.getElementById('asset-info').className = 'asset-info hidden';
  loadStats();
}

(async () => {
  await loadSessions();
  await loadAssets();
})();
</script>
</body>
</html>
